<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Tracker{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #333; }
        h1 { color: #2c5f8a; }
        nav a { margin-right: 15px; color: #2c5f8a; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        .flash { padding: 10px; border-radius: 4px; margin: 10px 0; }
        .flash.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .flash.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; }
        th { background: #2c5f8a; color: white; }
        tr:hover { background: #f5f5f5; }
        .btn { display: inline-block; padding: 7px 14px; border-radius: 4px; border: none; cursor: pointer; text-decoration: none; font-size: 14px; }
        .btn-primary { background: #2c5f8a; color: white; }
        .btn-primary:hover { background: #1e4166; }
        .btn-warning { background: #e0a800; color: white; }
        .btn-warning:hover { background: #c69500; }
        .btn-danger { background: #c0392b; color: white; }
        .btn-danger:hover { background: #a93226; }
        label { display: block; margin: 12px 0 4px; font-weight: bold; }
        input[type=text], input[type=date], select, textarea {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        textarea { height: 100px; resize: vertical; }
        .form-actions { margin-top: 20px; }
        .status-Applied { background: #cce5ff; color: #004085; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .status-Phone-Screen { background: #fff3cd; color: #856404; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .status-Interview { background: #d1ecf1; color: #0c5460; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .status-Offer { background: #d4edda; color: #155724; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .status-Rejected { background: #f8d7da; color: #721c24; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .status-Withdrawn { background: #e2e3e5; color: #383d41; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        select.filter { width: auto; display: inline-block; margin-left: 10px; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}">All Applications</a>
        <a href="{{ url_for('add') }}">+ Add Application</a>
    </nav>
    <hr>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</body>
</html>
